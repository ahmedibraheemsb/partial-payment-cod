<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Partial Payment</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0d;
    --bg-card: #161618;
    --bg-input: #1e1e21;
    --border: #2a2a2e;
    --text: #f5f5f5;
    --text-dim: #8b8b8f;
    --accent: #f43f5e;
    --success: #22c55e;
    --success-glow: rgba(34,197,94,0.15);
    --error: #ef4444;
    --error-glow: rgba(239,68,68,0.15);
    --gold: #f59e0b;
    --gold-glow: rgba(245,158,11,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }

  .container { max-width: 460px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 1.5rem; padding-top: 0.5rem; }
  .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; }
  .header p { color: var(--text-dim); font-size: 0.85rem; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
  }

  .input-group { margin-bottom: 0.75rem; }
  .input-group:last-child { margin-bottom: 0; }
  .input-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 0.35rem;
  }

  .input-group input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    direction: ltr;
  }

  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: var(--text-dim); font-size: 0.85rem; }

  .input-group input.amount-input {
    font-size: 1.3rem;
    font-weight: 700;
    text-align: center;
    color: var(--gold);
    border-color: rgba(245,158,11,0.3);
  }

  .input-group input.amount-input:focus { border-color: var(--gold); }

  .order-preview {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 1rem;
    display: none;
  }

  .order-preview.visible { display: block; }

  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.3rem 0;
    font-size: 0.85rem;
  }

  .preview-label { color: var(--text-dim); }
  .preview-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .preview-value.order-num { color: var(--accent); }
  .preview-value.amount { color: var(--gold); }
  .preview-value.balance { color: var(--text-dim); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0.5rem 0;
  }

  .btn-primary {
    width: 100%;
    padding: 1rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: var(--gold);
    color: #000;
    margin-bottom: 0.75rem;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .settings-toggle {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.6rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 0.75rem;
    transition: border-color 0.2s;
  }

  .settings-toggle:hover { border-color: var(--text-dim); }

  .settings-content { display: none; margin-bottom: 0.75rem; }
  .settings-content.active { display: block; }

  .settings-content .input-group input {
    font-size: 0.85rem;
    padding: 0.7rem 1rem;
  }

  .result-box {
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    display: none;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .result-box.success {
    display: block;
    background: var(--success-glow);
    border: 1px solid rgba(34,197,94,0.3);
    color: var(--success);
  }

  .result-box.error {
    display: block;
    background: var(--error-glow);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--error);
  }

  .result-box .result-title {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 0.3rem;
  }

  .result-box .result-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    opacity: 0.8;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-left: 0.4rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <h1>💰 Partial Payment</h1>
    <p>تسجيل دفع جزئي على أوردر</p>
  </header>

  <div class="card">
    <div class="input-group">
      <label>رقم الأوردر</label>
      <input
        type="text"
        id="orderInput"
        placeholder="#32109"
        inputmode="numeric"
        oninput="handleOrderInput()"
      >
    </div>
    <div class="input-group">
      <label>المبلغ المستلم (EGP)</label>
      <input
        type="number"
        id="amountInput"
        class="amount-input"
        placeholder="0.00"
        inputmode="decimal"
        min="1"
        step="0.01"
        oninput="updatePreview()"
      >
    </div>
  </div>

  <!-- Preview -->
  <div class="order-preview" id="orderPreview">
    <div class="preview-row">
      <span class="preview-label">الأوردر:</span>
      <span class="preview-value order-num" id="previewOrder">—</span>
    </div>
    <div class="preview-row">
      <span class="preview-label">المبلغ المستلم:</span>
      <span class="preview-value amount" id="previewAmount">—</span>
    </div>
    <hr class="divider">
    <div class="preview-row">
      <span class="preview-label">طريقة الدفع:</span>
      <span class="preview-value">Cash on Delivery (COD)</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result-box" id="resultBox">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-detail" id="resultDetail"></div>
  </div>

  <!-- Action -->
  <button class="btn-primary" id="payBtn" onclick="submitPayment()">
    💵 تسجيل الدفع
  </button>

  <!-- Settings -->
  <button class="settings-toggle" onclick="toggleSettings()">⚙️ الإعدادات</button>
  <div class="settings-content" id="settings">
    <div class="card">
      <div class="input-group">
        <label>Worker URL</label>
        <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev/payment">
      </div>
      <div class="input-group">
        <label>Worker Secret</label>
        <input type="password" id="workerSecret" placeholder="WORKER_SECRET">
      </div>
    </div>
  </div>

</div>
<script>
  // Load saved settings
  document.getElementById('workerUrl').value    = localStorage.getItem('payment_worker_url')    || '';
  document.getElementById('workerSecret').value = localStorage.getItem('payment_worker_secret') || '';

  document.getElementById('workerUrl').addEventListener('change',    e => localStorage.setItem('payment_worker_url',    e.target.value));
  document.getElementById('workerSecret').addEventListener('change', e => localStorage.setItem('payment_worker_secret', e.target.value));

  function handleOrderInput() {
    updatePreview();
    hideResult();
  }

  function updatePreview() {
    const orderRaw = document.getElementById('orderInput').value.trim();
    const amount   = document.getElementById('amountInput').value.trim();
    const orderNum = orderRaw.replace(/^#/, '');

    if (orderNum && /^\d+$/.test(orderNum) && parseFloat(amount) > 0) {
      document.getElementById('previewOrder').textContent  = `#${orderNum}`;
      document.getElementById('previewAmount').textContent = `${parseFloat(amount).toLocaleString('ar-EG')} ج.م`;
      document.getElementById('orderPreview').classList.add('visible');
    } else {
      document.getElementById('orderPreview').classList.remove('visible');
    }
  }

  function hideResult() {
    const box = document.getElementById('resultBox');
    box.className = 'result-box';
  }

  function toggleSettings() {
    document.getElementById('settings').classList.toggle('active');
  }

  async function submitPayment() {
    const workerUrl    = document.getElementById('workerUrl').value.trim();
    const workerSecret = document.getElementById('workerSecret').value.trim();
    const orderRaw     = document.getElementById('orderInput').value.trim();
    const amount       = parseFloat(document.getElementById('amountInput').value);
    const orderNumber  = orderRaw.replace(/^#/, '');

    if (!workerUrl || !workerSecret) {
      document.getElementById('settings').classList.add('active');
      showResult(false, 'أدخل Worker URL و Worker Secret', '');
      return;
    }

    if (!orderNumber || !/^\d+$/.test(orderNumber)) {
      showResult(false, 'أدخل رقم أوردر صحيح', '');
      return;
    }

    if (!amount || amount <= 0) {
      showResult(false, 'أدخل مبلغ صحيح', '');
      return;
    }

    if (!confirm(`تسجيل دفع ${amount.toLocaleString('ar-EG')} ج.م على الأوردر #${orderNumber}؟`)) return;

    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.innerHTML = 'جاري التسجيل... <span class="spinner"></span>';
    hideResult();

    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${workerSecret}`,
        },
        body: JSON.stringify({
          orderNumber: `#${orderNumber}`,
          amount: amount.toFixed(2),
        }),
      });

      const data = await response.json();

      if (data.success) {
        showResult(true,
          `✅ تم تسجيل ${amount.toLocaleString('ar-EG')} ج.م بنجاح`,
          `Transaction ID: ${data.transactionId || '—'}`
        );
        document.getElementById('orderInput').value = '';
        document.getElementById('amountInput').value = '';
        document.getElementById('orderPreview').classList.remove('visible');
      } else {
        showResult(false, `فشل التسجيل`, data.error || 'خطأ غير متوقع');
      }

    } catch (err) {
      showResult(false, 'خطأ في الاتصال', err.message);
    }

    btn.disabled = false;
    btn.innerHTML = '💵 تسجيل الدفع';
  }

  function showResult(success, title, detail) {
    const box = document.getElementById('resultBox');
    box.className = `result-box ${success ? 'success' : 'error'}`;
    document.getElementById('resultTitle').textContent  = title;
    document.getElementById('resultDetail').textContent = detail;
  }
</script>
</body>
</html>
